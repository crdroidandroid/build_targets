name: Validate build targets

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate build_targets schema
        run: python3 tools/validate_build_targets.py build_targets

      - name: Run validator tests
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest
          pytest tests -q
